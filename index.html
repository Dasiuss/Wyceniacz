<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wyceniacz</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="topbar">
    <h1>Wyceniacz</h1>
    <div class="statusline">
      <span id="state-pill" class="pill">Łączenie…</span>
      <span id="online-pill" class="pill">Online: –</span>
    </div>
  </header>

  <div id="fatal" class="fatal" hidden></div>

  <main>
    <div id="sections" class="sections"></div>

    <section class="panel">
      <div class="link-group">
        <label class="panel-label" for="jira">Link</label>
        <input id="jira" type="url" spellcheck="false" placeholder="adres ticketu w Jirze">
        <button id="go" type="button" class="icon-btn"
                title="Otwórz w nowej karcie" aria-label="Otwórz link w nowej karcie">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
            <polyline points="15 3 21 3 21 9"></polyline>
            <line x1="10" y1="14" x2="21" y2="3"></line>
          </svg>
        </button>
      </div>

      <div class="buttons">
        <button id="reveal" type="button" class="btn primary">Odkryj</button>
        <button id="reset" type="button" class="btn danger">Resetuj</button>
      </div>

      <div class="sum">
        <span class="sum-label">Suma (BE + FE + Testy)</span>
        <span id="sum" class="sum-value">–</span>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
